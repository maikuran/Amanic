name: 燦々世界Wiki 全画像ZIP取得

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:

      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: mainを最新状態にする
        run: |
          git pull origin main

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要ライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: 全画像をダウンロードしてZIP化
        run: |
          python python.py

      - name: ZIPをArtifactとして保存
        uses: actions/upload-artifact@v4
        with:
          name: sansansekai-images
          path: sansansekai_images.zip
          if-no-files-found: error
          retention-days: 7
